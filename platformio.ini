; ============================================================================
;  WiPhone firmware — PlatformIO / VS Code project
;  Step 1 of the plan: get the stock firmware building here (out of Arduino IDE),
;  then the Meshtastic lora.cpp/.h drop-in compiles with RadioLib as a managed dep.
; ============================================================================
[platformio]
;  Build the firmware straight out of the existing WiPhone/ folder. PlatformIO's
;  Arduino builder handles .ino files natively (concatenates + auto-prototypes like
;  the Arduino IDE), so we get a first compile WITHOUT renaming everything to .cpp.
;  Renaming to src/main.cpp is optional later cleanup, not required to build.
src_dir = WiPhone

[env:wiphone]
platform  = espressif32@^6.6.0          ; Arduino-ESP32 2.x core (matches WiPhone's era)
board     = esp32dev                     ; WROVER-class ESP32 w/ PSRAM (WiPhone hardware)
framework = arduino
monitor_speed = 115200
upload_speed  = 921600

; --- board / memory: WiPhone uses PSRAM + a large SPIFFS data partition ---
board_build.partitions = huge_app.csv    ; start here; switch to a custom CSV if you
board_build.filesystem = spiffs          ; keep SPIFFS (phonebook, SIP accts, ringtone, bg)
build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DCORE_DEBUG_LEVEL=3                    ; log_i/log_e visible while bringing up the radio

; --- libraries ---
;  RadioLib REPLACES RadioHead (RH_RF95). Pin it so the RX-interrupt API is stable
;  (setPacketReceivedAction). mbedtls AES ships with the ESP32 core — no dep needed.
lib_deps =
  jgromes/RadioLib @ ^6.6.0

;  The WiPhone tree vendors TFT_eSPI and other libs under WiPhone/src/ — point the
;  build at them so we don't pull conflicting copies from the registry.
lib_extra_dirs =
  WiPhone/src

; ----------------------------------------------------------------------------
;  MIGRATION NOTES (Arduino IDE -> here). With src_dir=WiPhone the .ino builds as-is;
;  the remaining first-compile gotchas are library + toolchain, not restructuring:
;   1. data/ (SPIFFS assets) already lives in WiPhone/data — upload with
;      `pio run -t uploadfs` (uses that folder via src_dir).
;   2. Board-manager package "WiPhone by ESP32-WiPhone" was Arduino-IDE only; here
;      espressif32@6.6 gives the equivalent Arduino-ESP32 2.x core. If a WiPhone-
;      specific variant (pins_arduino.h) is needed, drop it under boards/ and set
;      `board = wiphone`.
;   3. RadioHead is gone: lora.h/.cpp now use RadioLib (managed dep below). Remove any
;      leftover RadioHead board-package includes if the core complains.
;   4. First build WILL surface a few missing-lib / macro errors from the vendored
;      WiPhone/src libs — expected, resolve one at a time. This is the Phase-1 work.
; ----------------------------------------------------------------------------
