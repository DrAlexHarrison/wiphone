; ============================================================================
;  WiPhone firmware — PlatformIO project (out of Arduino IDE, into VS Code/CLI)
;
;  Build:   pio run
;  Flash:   pio run -t upload        (WiPhone in bootloader mode over USB)
;  Serial:  pio device monitor       (115200 — watch the "Meshtastic LoRa up" line)
;  SPIFFS:  pio run -t uploadfs      (uploads WiPhone/data — ringtone, configs, bg)
; ============================================================================
[platformio]
; PlatformIO's Arduino builder handles WiPhone.ino natively (concatenates +
; auto-prototypes like the Arduino IDE), so the tree builds without renaming
; anything. WiPhone/src/** (vendored TFT_eSPI, drivers, fonts) compiles as
; project source exactly the way the Arduino IDE compiled it.
src_dir = WiPhone
data_dir = WiPhone/data

[env:wiphone]
; arduino-esp32 1.0.6 — same core era as the "WiPhone by ESP32" board package
; (v0.14) this firmware was written against. The code uses 1.x APIs throughout
; (SYSTEM_EVENT_* WiFi events, legacy I2S driver), so don't bump to
; espressif32@6.x without porting those.
platform  = espressif32@3.5.0
board     = esp32dev                     ; ESP32-WROVER w/ PSRAM (WiPhone hardware)
framework = arduino
monitor_speed = 115200
upload_speed  = 921600

board_build.partitions = min_spiffs.csv  ; big app partitions + SPIFFS for messages/configs
board_build.filesystem = spiffs

build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DCORE_DEBUG_LEVEL=3                   ; log_i/log_e visible while bringing up the radio

; the ESP32 core forces -Werror=reorder; the Arduino IDE built this code with
; warnings suppressed, so the stock GUI trips gcc's member-init-order pedantry
build_unflags = -Werror=reorder

; don't compile helper scripts / assets
build_src_filter = +<*> -<tools/> -<data/>

; RadioLib replaces RadioHead (which came from the WiPhone board package and is
; gone with it). mbedtls AES ships in the ESP32 core — no dependency needed.
lib_deps =
  jgromes/RadioLib @ ^6.6.0
